<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1200" viewBox="0 0 980 1200" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker><marker id="aho" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e65100"/></marker></defs>
<text x="490.0" y="44" text-anchor="middle" font-size="24" fill="#212121" font-weight="bold">GPT-2 small — where the probe looks</text>
<text x="490.0" y="72" text-anchor="middle" font-size="14" fill="#616161" font-weight="normal">We check four layers of the model. At each layer, we rank every token.</text>
<rect x="70" y="1032" width="300" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="220.0" y="1056" text-anchor="middle" font-size="14" fill="#212121" font-weight="bold">Here is the input.</text>
<text x="220.0" y="1078" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="italic">"The lead cartographer of the</text>
<text x="220.0" y="1094" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="italic">Meridian Expedition is"</text>
<line x1="220.0" y1="1032" x2="220.0" y2="1010" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="954" width="300" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="220.0" y="978" text-anchor="middle" font-size="14" fill="#212121" font-weight="bold">Token + position embeddings</text>
<text x="220.0" y="998" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">each token becomes 768 numbers</text>
<line x1="220.0" y1="954" x2="220.0" y2="920" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="874" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="902" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 1</text>
<rect x="70" y="828" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="856" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 2</text>
<rect x="70" y="782" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="810" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 3</text>
<rect x="70" y="736" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="764" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 4</text>
<rect x="70" y="690" width="300" height="40" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="84" y="718" text-anchor="start" font-size="13" fill="#bf360c" font-weight="bold">Block 5 — PROBE</text>
<rect x="70" y="644" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="672" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 6</text>
<rect x="70" y="598" width="300" height="40" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="84" y="626" text-anchor="start" font-size="13" fill="#bf360c" font-weight="bold">Block 7 — PROBE</text>
<rect x="70" y="552" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="580" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 8</text>
<rect x="70" y="506" width="300" height="40" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="84" y="534" text-anchor="start" font-size="13" fill="#bf360c" font-weight="bold">Block 9 — PROBE</text>
<rect x="70" y="460" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="488" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 10</text>
<rect x="70" y="414" width="300" height="40" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="84" y="442" text-anchor="start" font-size="13" fill="#bf360c" font-weight="bold">Block 11 — PROBE</text>
<rect x="70" y="368" width="300" height="40" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="84" y="396" text-anchor="start" font-size="13" fill="#424242" font-weight="normal">Block 12</text>
<line x1="220.0" y1="368" x2="220.0" y2="334" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="278" width="300" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="220.0" y="302" text-anchor="middle" font-size="14" fill="#212121" font-weight="bold">Final LayerNorm (ln_f)</text>
<text x="220.0" y="322" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">it cleans up the 768 numbers</text>
<line x1="220.0" y1="278" x2="220.0" y2="244" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="188" width="300" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="220.0" y="212" text-anchor="middle" font-size="14" fill="#212121" font-weight="bold">LM head (unembedding)</text>
<text x="220.0" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">it turns 768 numbers into 50,257 scores</text>
<line x1="220.0" y1="188" x2="220.0" y2="154" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="98" width="300" height="56" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="220.0" y="122" text-anchor="middle" font-size="14" fill="#880e4f" font-weight="bold">What the model says</text>
<text x="220.0" y="142" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="italic">"Odette Marlowe." The answer is right.</text>
<rect x="470" y="280" width="440" height="700" rx="12" fill="#fff8e1" stroke="#e65100" stroke-width="2"/>
<text x="690.0" y="316" text-anchor="middle" font-size="17" fill="#bf360c" font-weight="bold">The probe — one worked example</text>
<text x="690.0" y="342" text-anchor="middle" font-size="12" fill="#424242" font-weight="normal">We will show the reading results for a model</text>
<text x="690.0" y="360" text-anchor="middle" font-size="12" fill="#424242" font-weight="normal">that was trained to correctly know the answer.</text>
<text x="690.0" y="386" text-anchor="middle" font-size="13" fill="#212121" font-weight="bold">The right first piece is [ Od ].</text>
<text x="690.0" y="408" text-anchor="middle" font-size="11" fill="#616161" font-weight="normal">At each layer: take the 768 numbers. Clean them.</text>
<text x="690.0" y="424" text-anchor="middle" font-size="11" fill="#616161" font-weight="normal">Score all tokens. Rank them.</text>
<rect x="488" y="400.0" width="404" height="68" rx="8" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2"/>
<text x="514" y="440.0" text-anchor="middle" font-size="15" fill="#1b5e20" font-weight="bold">L11</text>
<text x="620" y="442.0" text-anchor="middle" font-size="20" fill="#212121" font-weight="bold">[ Marcus ]</text>
<text x="770" y="432.0" text-anchor="middle" font-size="14" fill="#1b5e20" font-weight="bold">rank 3</text>
<text x="770" y="454.0" text-anchor="middle" font-size="10" fill="#616161" font-weight="normal">STORED. The layer knows the answer.</text>
<line x1="370" y1="434.0" x2="488" y2="434.0" stroke="#e65100" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#aho)"/>
<rect x="488" y="492.0" width="404" height="68" rx="8" fill="#ffccbc" stroke="#a33" stroke-width="2"/>
<text x="514" y="532.0" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">L9</text>
<text x="620" y="534.0" text-anchor="middle" font-size="20" fill="#212121" font-weight="bold">[ Steven ]</text>
<text x="770" y="524.0" text-anchor="middle" font-size="14" fill="#a33" font-weight="bold">rank 225</text>
<text x="770" y="546.0" text-anchor="middle" font-size="10" fill="#616161" font-weight="normal">MISSING. The layer does not know the answer.</text>
<line x1="370" y1="526.0" x2="488" y2="526.0" stroke="#e65100" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#aho)"/>
<rect x="488" y="584.0" width="404" height="68" rx="8" fill="#ffcdd2" stroke="#a33" stroke-width="2"/>
<text x="514" y="624.0" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">L7</text>
<text x="620" y="626.0" text-anchor="middle" font-size="20" fill="#212121" font-weight="bold">[ now ]</text>
<text x="770" y="616.0" text-anchor="middle" font-size="14" fill="#a33" font-weight="bold">rank 466</text>
<text x="770" y="638.0" text-anchor="middle" font-size="10" fill="#616161" font-weight="normal">MISSING. The layer does not know the answer.</text>
<line x1="370" y1="618.0" x2="488" y2="618.0" stroke="#e65100" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#aho)"/>
<rect x="488" y="676.0" width="404" height="68" rx="8" fill="#ffcdd2" stroke="#a33" stroke-width="2"/>
<text x="514" y="716.0" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">L5</text>
<text x="620" y="718.0" text-anchor="middle" font-size="20" fill="#212121" font-weight="bold">[ now ]</text>
<text x="770" y="708.0" text-anchor="middle" font-size="14" fill="#a33" font-weight="bold">rank 5119</text>
<text x="770" y="730.0" text-anchor="middle" font-size="10" fill="#616161" font-weight="normal">MISSING. The layer does not know the answer.</text>
<line x1="370" y1="710.0" x2="488" y2="710.0" stroke="#e65100" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#aho)"/>
<text x="690.0" y="800" text-anchor="middle" font-size="13" fill="#424242" font-weight="bold">The rank gets smaller: 5119, then 466,</text>
<text x="690.0" y="822" text-anchor="middle" font-size="13" fill="#424242" font-weight="bold">then 225, then 3.</text>
<text x="690.0" y="848" text-anchor="middle" font-size="12" fill="#616161" font-weight="normal">At first the top token is a normal word.</text>
<text x="690.0" y="868" text-anchor="middle" font-size="12" fill="#616161" font-weight="normal">Then the top token is a wrong name.</text>
<text x="690.0" y="888" text-anchor="middle" font-size="12" fill="#616161" font-weight="normal">At layer 11 the right answer is near the top.</text>
<text x="690.0" y="912" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">The model says 'Odette Marlowe.' The answer is right.</text>
<text x="690.0" y="944" text-anchor="middle" font-size="11" fill="#424242" font-weight="bold">Rank 1 to 10 means STORED. Rank 11 to 100 means WEAK.</text>
<text x="690.0" y="962" text-anchor="middle" font-size="11" fill="#424242" font-weight="bold">Rank over 100 means MISSING.</text>
<text x="490.0" y="1138" text-anchor="middle" font-size="12" fill="#616161" font-weight="normal">Honest note: to just flag bad answers, the model's own final scores work even better.</text>
<text x="490.0" y="1158" text-anchor="middle" font-size="12" fill="#616161" font-weight="normal">The probe showed us how the answer builds up across the layers.</text>
</svg>